<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- Gradient vertical émeraude -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Fond carré plein — iOS arrondit automatiquement -->
  <rect width="180" height="180" fill="url(#bg-gradient)"/>

  <!-- Motif géométrique islamique : étoile à 8 branches, adapté 180x180 -->
  <g opacity="0.08" fill="#ffffff" transform="translate(90,90)">
    <!-- Carré 1 (droit) -->
    <rect x="-32" y="-32" width="64" height="64" rx="3"/>
    <!-- Carré 2 (pivoté 45°) -->
    <rect x="-32" y="-32" width="64" height="64" rx="3" transform="rotate(45)"/>
    <!-- Cercle central -->
    <circle cx="0" cy="0" r="21" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Rayons décoratifs radiaux -->
    <line x1="0" y1="-53" x2="0" y2="-36" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="36" x2="0" y2="53" stroke="#ffffff" stroke-width="1"/>
    <line x1="-53" y1="0" x2="-36" y2="0" stroke="#ffffff" stroke-width="1"/>
    <line x1="36" y1="0" x2="53" y2="0" stroke="#ffffff" stroke-width="1"/>
    <line x1="-37" y1="-37" x2="-25" y2="-25" stroke="#ffffff" stroke-width="1"/>
    <line x1="25" y1="-25" x2="37" y2="-37" stroke="#ffffff" stroke-width="1"/>
    <line x1="-37" y1="37" x2="-25" y2="25" stroke="#ffffff" stroke-width="1"/>
    <line x1="25" y1="25" x2="37" y2="37" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Lettre arabe م (mim), grande, légèrement au-dessus du centre -->
  <text
    x="90"
    y="112"
    text-anchor="middle"
    font-family="serif"
    font-size="110"
    fill="#ffffff"
    font-weight="bold"
  >م</text>

  <!-- Ligne horizontale décorative sous la lettre -->
  <line
    x1="68" y1="132"
    x2="112" y2="132"
    stroke="rgba(255,255,255,0.3)"
    stroke-width="1.5"
    stroke-linecap="round"
  />
</svg>
